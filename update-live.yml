# Keeps data/live.json fresh when the site is hosted statically (e.g. GitHub Pages).
# The Node server does the same job on its own timer, so this is only needed for static hosting.
name: Update live official feed
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node updater.js
      - name: Commit changes
        run: |
          git config user.name "defence-track-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "chore: refresh live official feed"
          git push
